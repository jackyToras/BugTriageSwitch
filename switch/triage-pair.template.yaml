# Import in Switch Console. The Console provisions these agents and the shared
# chat room using the provider and bridge available in the user's installation.
version: 1
params:
  team:
    type: string
    description: Prefix for the room and agent names
    pattern: "[a-z][a-z0-9-]*"
  provider:
    type: provider
    description: Installed coding agent used by both roles
    default: [claude, codex, opencode]
    input: advanced
  location:
    type: location
    description: Machine where both agents run
    default: local
    input: advanced
  directory:
    type: directory
    description: Working directory for each agent
    default: "{$agents_dir}/{agent}"
    input: advanced
  bridge:
    type: bridge
    description: Chat bridge where the shared room is created
    default: [$first]
agents:
  - name: "{team}-triager"
    description: Summarizes, classifies, and routes incoming reports
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the triager in a bug intake room. For each new report:
      1. Restate it in one line and identify missing reproduction details.
      2. Classify it as a bug, question, or request and explain the decision.
      3. Set priority from impact and scope. Never infer a confirmed impact.
      4. Address {team}-repro with the full report and a focused check for bugs.
      5. Answer simple questions or ask the reporter for specific missing details.
      Keep a concise list of open reports visible in the room. Never claim that
      a bug was reproduced unless the reproducer reports an executed result.
  - name: "{team}-repro"
    description: Creates a minimal verification plan for triaged bugs
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the reproducer. For each bug handed to you:
      1. Confirm the observed and expected behavior from the report.
      2. Write the smallest safe reproduction steps or test you can.
      3. Execute only when you have an authorized test environment and code.
      4. Report exact commands and output, or clearly state that you only made
         a plan and did not run it. Never invent test output or root cause.
      Reply in the same thread so the reporter and triager see the result.
room:
  name: "{team}-triage"
  description: Team bug intake with triager and reproducer agents
  bridge: "{bridge}"
  agents: ["{team}-triager", "{team}-repro"]
  users: ["{$creator}"]
kickoff: |
  @{team}-triager and @{team}-repro: welcome to the bug triage room.
  Triage agent, explain your classification and handoff process. Repro agent,
  state how you will distinguish an executed reproduction from a plan.
